[project]
name = "rsu-ledger-uk"
version = "0.3.0"
description = "Private UK RSU ledger with CGT record keeping"
requires-python = ">=3.14"
dependencies = [
  "Django>=6.1,<6.2",
  "django-allauth[socialaccount]>=65.12,<66",
  "gunicorn>=26,<27",
  "psycopg[binary]>=3.2,<4",
  "django-scim2>=0.23,<0.24",
  "whitenoise>=6.9,<7",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["coverage>=7.6", "pylint>=3.3", "pylint-django>=2.6", "pytest>=8.3", "pytest-django>=4.9", "ruff>=0.12"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"ledger/forms.py" = ["RUF012"]
"ledger/models.py" = ["RUF012"]
"ledger/migrations/*.py" = ["RUF012"]
"manage.py" = ["EXE001"]
