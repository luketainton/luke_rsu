<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RSU Ledger UK</title><style>body{font-family:system-ui,sans-serif;background:#f7f9fc;color:#101827;max-width:1100px;margin:auto;padding:2rem}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}a{color:#304fc8}button{background:#304fc8;color:#fff;border:0;border-radius:6px;padding:.65rem 1rem;cursor:pointer}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:.55rem;margin:.25rem 0 1rem}table{border-collapse:collapse;width:100%;background:white;margin:1rem 0}th,td{text-align:left;padding:.7rem;border-bottom:1px solid #dde3ed}.card{background:white;border:1px solid #dde3ed;border-radius:10px;padding:1.25rem;margin:1rem 0}.actions{display:flex;gap:.6rem;flex-wrap:wrap}.muted{color:#5e6b80}.message{background:#e6f5de;padding:.7rem;border-radius:6px}</style></head><body><nav><strong>RSU Ledger <small>UK</small></strong>{% if user.is_authenticated %}<span>{{ user.email }} · <a href="{% url 'logout' %}">Sign out</a></span>{% endif %}</nav>{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</body></html>
