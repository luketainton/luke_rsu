<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSU Ledger UK</title>
  <style>
    :root { --background:#f7f9fc; --surface:#fff; --text:#101827; --muted:#5e6b80; --border:#dde3ed; --link:#304fc8; --message:#e6f5de; }
    html[data-theme="charcoal"] { --background:#111315; --surface:#202428; --text:#f4f6f8; --muted:#b7c0c9; --border:#3c434a; --link:#9bb9ff; --message:#1e3a29; }
    html[data-theme="navy"] { --background:#071526; --surface:#10253d; --text:#edf5ff; --muted:#adc3dc; --border:#284766; --link:#82c8ff; --message:#103e38; }
    body { font-family:system-ui,sans-serif; background:var(--background); color:var(--text); max-width:1100px; margin:auto; padding:2rem; }
    nav { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:2rem; }
    a { color:var(--link); }
    button { background:#304fc8; color:#fff; border:0; border-radius:6px; padding:.65rem 1rem; cursor:pointer; }
    button.secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
    input,select,textarea { display:block; width:100%; box-sizing:border-box; padding:.55rem; margin:.25rem 0 1rem; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:4px; }
    table { border-collapse:collapse; width:100%; background:var(--surface); margin:1rem 0; }
    th,td { text-align:left; padding:.7rem; border-bottom:1px solid var(--border); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.25rem; margin:1rem 0; }
    .actions,.theme-picker { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
    .muted { color:var(--muted); }
    .message { background:var(--message); padding:.7rem; border-radius:6px; }
    .danger { background:#b42318; }
    .inline-form { display:inline; }
    @media (max-width:700px) { body { padding:1rem; } nav { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <nav>
    <strong>RSU Ledger <small>UK</small></strong>
    <div class="theme-picker" aria-label="Colour theme">
      <span class="muted">Theme:</span>
      <button class="secondary" type="button" data-theme-choice="charcoal">Dark grey</button>
      <button class="secondary" type="button" data-theme-choice="navy">Navy blue</button>
    </div>
    {% if user.is_authenticated %}<span>{{ user.email }} · <a href="{% url 'logout' %}">Sign out</a></span>{% endif %}
  </nav>
  {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
  <script>
    const savedTheme = localStorage.getItem("rsu-theme");
    if (["charcoal", "navy"].includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
    document.querySelectorAll("[data-theme-choice]").forEach((button) => button.addEventListener("click", () => {
      const theme = button.dataset.themeChoice;
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("rsu-theme", theme);
    }));
  </script>
</body>
</html>
