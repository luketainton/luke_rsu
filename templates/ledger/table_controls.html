<form method="get" class="actions" aria-label="Table controls">
  <label>Search<input type="search" name="q" value="{{ q }}" placeholder="Search records"></label>
  <label>Sort<select name="sort">{% for value, label in sort_options %}{% if sort == value %}<option value="{{ value }}" selected>{{ label }}</option>{% else %}<option value="{{ value }}">{{ label }}</option>{% endif %}{% endfor %}</select></label>
  <button type="submit">Apply</button>
  <a href="{{ request.path }}">Clear</a>
</form>
