{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Delete exchange rate?</h1>
  <p>This permanently removes {{ rate.label }} ({{ rate.get_method_display }}).</p>
  <form method="post" class="inline-form">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><button class="danger" type="submit">Delete exchange rate</button></form>
  <a href="{{ next }}">Cancel</a>
</section>
{% endblock %}
